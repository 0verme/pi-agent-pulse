name: CI

on:
    push:
        branches: [main, "feat/**"]
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              # v4.2.2
              uses: >-
                  actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Setup Node.js
              # v4.4.0
              uses: >-
                  actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22.19.0
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Typecheck
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Format check
              run: npm run format:check
            - name: Unit tests
              run: npm test
            - name: Build
              run: npm run build
